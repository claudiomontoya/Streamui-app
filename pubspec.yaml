name: streamui_chat
description: Flutter chat app with intelligent scroll and streaming support

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  file_picker: ^6.1.1
  speech_to_text: ^6.6.0
  permission_handler: ^11.1.0
  path: ^1.8.3
  mime: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
